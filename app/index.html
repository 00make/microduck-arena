    <!-- Anton: the landing's brutal print display voice (FancyTitle /
         ComicButton on the pollen-website Microduck pages). Self-hosted
         (latin subset, OFL) — no Google Fonts CDN round-trips. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/anton-latin.woff2" />
    <style>
      @font-face {
        font-family: 'Anton';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/anton-latin.woff2') format('woff2');
      }
      :root {
        --ink: #08080c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body { background: var(--ink); overflow: hidden; }
      #root { height: 100%; }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
