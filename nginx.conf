server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm application/json model/gltf-binary application/octet-stream;
    gzip_min_length 1024;
    gzip_vary on;

    # 跨源隔离头（为 SharedArrayBuffer / 潜在多线程预留；当前 ONNX numThreads=1 单线程运行）
    add_header Cross-Origin-Opener-Policy same-origin;
    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header X-Content-Type-Options nosniff;

    # 哈希文件长缓存
    location /bundle/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header X-Content-Type-Options nosniff;
    }

    # 非哈希资源短缓存
    location ~ ^/(assets|policies|robot)/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header X-Content-Type-Options nosniff;
    }

    # 自托管字体（带版本控制的稳定文件，长缓存）
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header X-Content-Type-Options nosniff;
    }

    # 屏蔽 Cloudflare 专用部署文件（对 nginx 无意义）
    location = /_headers { return 404; }
    location = /_redirects { return 404; }
}
